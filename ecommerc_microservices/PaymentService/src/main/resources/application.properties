spring.application.name=payment-service
server.port=8089

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/paymentdb?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# Stripe secret (from environment variable)
stripe.secret.key=${STRIPE_SECRET_KEY}

# Config server (optional)
spring.config.import=optional:configserver:http://localhost:8888

# JWT Validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8087

# Kafka broker
spring.kafka.bootstrap-servers=localhost:9092

# Producer JSON
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer JSON
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.group-id=payment-group
